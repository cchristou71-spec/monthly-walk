<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COS</title>
<meta name="application-name" content="COS">
<meta name="apple-mobile-web-app-title" content="COS">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f5d43">
<link rel="icon" type="image/png" sizes="192x192" href="cos-icon-192.png">
<link rel="apple-touch-icon" href="cos-icon-180.png">
<link rel="manifest" href="cos-manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#1d2b24;--paper:#f6f4ee;--line:#d6d2c4;--green:#1f5d43;--route:#d9480f;--rec:#c2255c;--muted:#6b7068}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
#wrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}
#sb{position:absolute;z-index:1000;top:calc(10px + env(safe-area-inset-top,0px));left:10px;width:calc(100% - 76px);max-width:460px;display:flex;flex-direction:column;gap:6px}
#q{flex:1;min-width:0}
#q,#area{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
#area{width:100%}
.sr{display:flex;gap:6px}
#pubs{white-space:nowrap;background:#fff}
#res{position:absolute;z-index:1000;top:calc(104px + env(safe-area-inset-top,0px));left:10px;width:calc(100% - 76px);max-width:460px;max-height:50%;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
#res[hidden]{display:none}
#res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 12px;background:#fff}
#res button:last-child{border-bottom:0}
#res small{display:block;color:var(--muted);font-size:12px}
#loc{position:absolute;z-index:1000;right:10px;bottom:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;color:var(--green)}
#panel{background:var(--paper);border-top:2px solid var(--green);padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));max-height:46vh;overflow:auto}
#tabs{display:flex;gap:4px;align-items:center;margin-bottom:8px}
.tab{flex:1;padding:9px 4px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-weight:600;color:var(--muted)}
.tab.on{background:var(--green);border-color:var(--green);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
button{font:inherit;padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--ink)}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.go{background:var(--route);border-color:var(--route);color:#fff;font-weight:700}
button.stop{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:700}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,.tab:focus-visible{outline:3px solid #1c7ed6;outline-offset:2px}
.big{font-size:22px;font-weight:700;margin-right:auto}
.m{color:var(--muted);font-size:13px;margin:0}
.pane[hidden]{display:none}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.stat div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.stat b{display:block;font-size:19px}
.stat span{font-size:12px;color:var(--muted)}
.off b{color:var(--rec)}
.it{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}
.it b{display:block}
.it div{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.it button{padding:6px 10px;font-size:14px}
.chk{margin-left:4px;font-size:13px;color:var(--muted);white-space:nowrap}
.wp{width:16px;height:16px;border-radius:50%;background:var(--route);border:3px solid #fff;box-shadow:0 0 0 1px var(--ink)}
#toast{position:fixed;z-index:3000;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:90%;background:var(--ink);color:#fff;padding:9px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <div id="sb"><div class="sr"><input id="q" type="search" placeholder="Pub name (optional)" aria-label="Pub name" enterkeyhint="search"><button id="pubs">Find pubs</button></div><input id="area" type="search" placeholder="Area (blank = where the map is)" aria-label="Area" enterkeyhint="search"></div><div id="res" hidden></div>
  <button id="loc" aria-label="Show my location">&#9678;</button>
</div>
<div id="panel">
  <div id="tabs" role="tablist">
    <button class="tab on" data-t="plot">Plot</button>
    <button class="tab" data-t="follow">Follow</button>
    <button class="tab" data-t="record">Record</button>
    <button class="tab" data-t="saved">Saved</button>
    <label class="chk"><input type="checkbox" id="ac" checked> Centre on me</label>
  </div>

  <div class="pane" id="p-plot">
    <div class="row" id="modes">
      <button data-m="straight">Straight</button><button data-m="foot" class="on">Walk</button><button data-m="bike">Cycle</button><button data-m="car">Drive</button>
    </div>
    <div class="row">
      <span class="big" id="pd">0.00 mi</span>
      <button id="undo">Undo</button><button id="clr">Clear</button><button id="sv">Save</button><button id="ex">Export GPX</button><button id="sh">Share to HDSG</button>
    </div>
    <div class="row"><button id="dl">Save this map area offline</button><span class="m" id="dls"></span></div>
    <p class="m">Tap the map to add points and drag a point to adjust it. Walk, Cycle and Drive snap points and legs to nearby paths or roads.</p>
  </div>

  <div class="pane" id="p-follow" hidden>
    <div class="row"><a id="back" href="./" hidden style="font-weight:600;color:var(--green);padding:6px 0">&larr; Back to HDSG Walks</a></div>
    <div class="row"><button id="fb" class="go">Start following</button><span class="m" id="fm">Uses the route on the map.</span></div>
    <div class="stat" id="fs"><div><b>–</b><span>Done</span></div><div><b>–</b><span>Left</span></div><div id="fo"><b>–</b><span>Off route</span></div></div>
  </div>

  <div class="pane" id="p-record" hidden>
    <div class="row"><button id="rb" class="go">Start recording</button><span class="m">Keep the screen on while recording.</span></div>
    <div class="stat"><div><b id="rd">0.00 mi</b><span>Distance</span></div><div><b id="rtm">0:00:00</b><span>Time</span></div><div><b id="ra">0 ft</b><span>Ascent</span></div></div>
  </div>

  <div class="pane" id="p-saved" hidden>
    <div class="row"><label><button type="button" onclick="document.getElementById('imp').click()">Import GPX</button><input id="imp" type="file" accept=".gpx,.xml,application/gpx+xml" multiple hidden></label></div>
    <div id="list"></div>
  </div>
</div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=i=>document.getElementById(i);
const mi=m=>(m/1609.344).toFixed(2)+' mi';
let tt;function toast(s){const t=$('toast');t.textContent=s;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3500)}

/* ---------- HDSG Walks link (shared Supabase project) ---------- */
const SB_URL='https://lpfifbhoglnlrntfqjxq.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwZmlmYmhvZ2xubHJudGZxanhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMTkzMzMsImV4cCI6MjA5MzU5NTMzM30.slcTjntVCrhpo07mkstwQvdWfm-L046Ej1tZe2TF5LI';
async function share(name,pts){
  try{
    const r=await fetch(SB_URL+'/rest/v1/cos_routes',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({name,gpx:gpx(name,pts),distance_m:Math.round(dist(pts))})});
    if(!r.ok)throw 0;
    toast('Shared. Pick it in HDSG Walks with "Choose from COS routes".');
  }catch(e){toast('Could not share. Check your connection and try again.')}
}

/* ---------- offline tile store (IndexedDB) ---------- */
const idb=new Promise((res,rej)=>{try{const r=indexedDB.open('tiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('t');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej()}});
const tget=k=>idb.then(db=>new Promise(r=>{const q=db.transaction('t').objectStore('t').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})).catch(()=>null);
const tput=(k,v)=>idb.then(db=>new Promise(r=>{const tx=db.transaction('t','readwrite');tx.objectStore('t').put(v,k);tx.oncomplete=r;tx.onerror=r})).catch(()=>null);
const turl=(id,z,x,y)=>id==='osm'?`https://tile.openstreetmap.org/${z}/${x}/${y}.png`:`https://${'abc'[(x+y)%3]}.tile.opentopomap.org/${z}/${x}/${y}.png`;
const CT=L.TileLayer.extend({createTile(c,done){
  const img=document.createElement('img');img.alt='';
  tget(this.options.id+c.z+'/'+c.x+'/'+c.y).then(b=>{
    if(b){const u=URL.createObjectURL(b);img.onload=()=>{URL.revokeObjectURL(u);done(null,img)};img.src=u}
    else{img.onload=()=>done(null,img);img.onerror=e=>done(e,img);img.src=turl(this.options.id,c.z,c.x,c.y)}
  });return img}});

/* ---------- map ---------- */
const map=L.map('map',{zoomControl:false}).setView([54.5,-3],6);
L.control.zoom({position:'topright'}).addTo(map);
const at='&copy; OpenStreetMap contributors';
const osm=new CT('',{id:'osm',maxZoom:19,attribution:at});
const topo=new CT('',{id:'topo',maxZoom:17,attribution:at+', SRTM | OpenTopoMap'});
osm.addTo(map);let base=osm;
L.control.layers({'Streets':osm,'Terrain':topo},null,{position:'topright'}).addTo(map);
map.on('baselayerchange',e=>base=e.layer);
new ResizeObserver(()=>map.invalidateSize()).observe($('wrap'));

/* ---------- tabs ---------- */
let tab='plot';
function tabTo(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('.pane').forEach(p=>p.hidden=p.id!=='p-'+t);if(t==='saved')list()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tabTo(b.dataset.t));

/* ---------- plot ---------- */
let wps=[],loaded=null,mode='foot';
const line=L.polyline([],{color:'#d9480f',weight:5,opacity:.9}).addTo(map);
const LL=p=>L.latLng(p[0],p[1]);
const path=()=>loaded?loaded.map(p=>[p[0],p[1]]):wps.flatMap(w=>w.seg);
const dist=p=>p.reduce((s,q,i)=>i?s+LL(p[i-1]).distanceTo(LL(q)):0,0);
const redraw=()=>{const p=path();line.setLatLngs(p);$('pd').textContent=mi(dist(p))};

async function seg(w){
  const i=wps.indexOf(w);
  if(i<1){w.seg=[[w.ll.lat,w.ll.lng]];return}
  const a=wps[i-1].ll,b=w.ll;
  w.seg=[[a.lat,a.lng],[b.lat,b.lng]];
  if(mode==='straight')return;
  try{
    const r=await fetch(`https://routing.openstreetmap.de/routed-${mode}/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`);
    const j=await r.json();
    if(j.routes&&j.routes[0])w.seg=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);else throw 0;
  }catch(e){toast('Could not snap that leg, so it is a straight line')}
}
async function snapPt(ll){
  if(mode==='straight')return ll;
  try{
    const r=await fetch(`https://routing.openstreetmap.de/routed-${mode}/nearest/v1/driving/${ll.lng},${ll.lat}?number=1`);
    const j=await r.json(),w=j.waypoints&&j.waypoints[0];
    if(w&&w.distance<=40)return L.latLng(w.location[1],w.location[0]);
  }catch(e){}
  return ll;
}
let addQ=Promise.resolve();
const addWp=ll=>{addQ=addQ.then(()=>add1(ll));return addQ};
async function add1(ll){
  if(loaded){loaded=null;toast('Loaded route cleared. New route started.')}
  ll=await snapPt(ll);
  const m=L.marker(ll,{draggable:true,icon:L.divIcon({className:'wp',iconSize:[16,16]})}).addTo(map);
  const w={ll,m,seg:[]};wps.push(w);
  m.on('dragend',async()=>{w.ll=await snapPt(m.getLatLng());m.setLatLng(w.ll);await seg(w);const n=wps[wps.indexOf(w)+1];if(n)await seg(n);redraw()});
  await seg(w);redraw();
}
function clearPlan(){wps.forEach(w=>map.removeLayer(w.m));wps=[];loaded=null;redraw()}
map.on('click',e=>{if(!$('res').hidden){$('res').hidden=true;return}if(tab==='plot')addWp(e.latlng)});
$('undo').onclick=()=>{if(loaded)return toast('Clear the loaded route first');const w=wps.pop();if(w){map.removeLayer(w.m);redraw()}};
$('clr').onclick=clearPlan;
document.querySelectorAll('#modes button').forEach(b=>b.onclick=async()=>{
  mode=b.dataset.m;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x===b));
  if(wps.length>1){toast('Re-snapping route…');for(const w of wps)await seg(w);redraw()}
});
$('sv').onclick=()=>{const p=path();if(p.length<2)return toast('Add at least two points first');
  const n=prompt('Name this route','Route '+new Date().toLocaleDateString('en-GB'));if(n)save(n,p,'route');toast('Route saved')};
$('sh').onclick=()=>{const p=path();if(p.length<2)return toast('Add at least two points first');
  const n=prompt('Name this route for HDSG','Route '+new Date().toLocaleDateString('en-GB'));if(!n)return;save(n,p,'route');share(n,p)};
$('ex').onclick=()=>{const p=path();if(p.length<2)return toast('Add at least two points first');dl('Route '+new Date().toLocaleDateString('en-GB'),p)};

/* ---------- GPX + storage ---------- */
function gpx(name,pts){
  const e=s=>s.replace(/[<&>]/g,c=>({'<':'&lt;','&':'&amp;','>':'&gt;'}[c]));
  return '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="UK Route Map" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>'+e(name)+'</name><trkseg>'+
    pts.map(p=>`<trkpt lat="${(+p[0]).toFixed(6)}" lon="${(+p[1]).toFixed(6)}">${p[2]!=null?`<ele>${(+p[2]).toFixed(1)}</ele>`:''}${p[3]?`<time>${new Date(p[3]).toISOString()}</time>`:''}</trkpt>`).join('')+
    '</trkseg></trk></gpx>';
}
function dl(name,pts){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([gpx(name,pts)],{type:'application/gpx+xml'}));
  a.download=(name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')||'route')+'.gpx';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
const store=()=>{try{return JSON.parse(localStorage.getItem('routes')||'[]')}catch(e){return[]}};
const put=a=>{try{localStorage.setItem('routes',JSON.stringify(a))}catch(e){toast('Storage is full. Export GPX files and delete old items.')}};
function save(name,pts,type){const a=store();a.unshift({id:Date.now()+Math.random(),name,pts,type,date:new Date().toISOString(),dist:dist(pts)});put(a);list()}
function show(r){clearPlan();loaded=r.pts;redraw();map.fitBounds(line.getBounds(),{padding:[40,40]})}
function list(){
  const a=store(),box=$('list');box.innerHTML=a.length?'':'<p class="m">Nothing saved yet. Save a plotted route or finish a recording.</p>';
  a.forEach(r=>{
    const d=document.createElement('div');d.className='it';
    d.innerHTML='<b></b><span class="m"></span><div><button>Show</button><button>Follow</button><button>Export GPX</button><button>Share to HDSG</button><button>Delete</button></div>';
    d.querySelector('b').textContent=r.name;
    d.querySelector('span').textContent=(r.type==='track'?'Recorded':'Planned')+', '+mi(r.dist)+', '+new Date(r.date).toLocaleDateString('en-GB');
    const [s,f,g,sb2,x]=d.querySelectorAll('button');
    s.onclick=()=>{show(r);tabTo('plot')};
    f.onclick=()=>{show(r);tabTo('follow')};
    g.onclick=()=>dl(r.name,r.pts);
    sb2.onclick=()=>share(r.name,r.pts);
    x.onclick=()=>{if(confirm('Delete "'+r.name+'"?')){put(store().filter(q=>q.id!==r.id));list()}};
    box.append(d);
  });
}
function parseGpx(text){
  const d=new DOMParser().parseFromString(text,'application/xml');
  let n=[...d.querySelectorAll('trkpt')];if(!n.length)n=[...d.querySelectorAll('rtept')];if(!n.length)n=[...d.querySelectorAll('wpt')];
  const pts=n.map(x=>{const el=x.querySelector('ele'),t=x.querySelector('time');return[+x.getAttribute('lat'),+x.getAttribute('lon'),el?+el.textContent:null,t?Date.parse(t.textContent):null]}).filter(p=>isFinite(p[0])&&isFinite(p[1]));
  const nm=d.querySelector('trk>name,rte>name,metadata>name');
  return{pts,name:nm&&nm.textContent.trim()||''};
}
$('imp').onchange=async e=>{
  for(const f of e.target.files){
    const r=parseGpx(await f.text());
    if(r.pts.length<2){toast('No route found in '+f.name);continue}
    save(r.name||f.name.replace(/\.gpx$/i,''),r.pts,'route');
    toast('Imported '+f.name);
  }
  e.target.value='';
};

/* ---------- location + wake lock ---------- */
const me=L.circleMarker([0,0],{radius:8,color:'#fff',weight:3,fillColor:'#1c7ed6',fillOpacity:1});
const acc=L.circle([0,0],{radius:0,weight:1,color:'#1c7ed6',fillOpacity:.1});
function showMe(p){const ll=[p.coords.latitude,p.coords.longitude];if(!map.hasLayer(me)){acc.addTo(map);me.addTo(map)}me.setLatLng(ll);acc.setLatLng(ll).setRadius(p.coords.accuracy);return ll}
const gerr=e=>toast(e.code===1?'Location is blocked. Allow it in your browser settings.':'Could not get your location');
$('loc').onclick=()=>navigator.geolocation.getCurrentPosition(p=>map.setView(showMe(p),16),gerr,{enableHighAccuracy:true});
let wl=null;
const wake=async()=>{try{wl=await navigator.wakeLock.request('screen')}catch(e){}};
const unwake=()=>{if(fw==null&&rw==null&&wl){wl.release().catch(()=>{});wl=null}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(fw!=null||rw!=null))wake()});

/* ---------- follow ---------- */
let fw=null,fpts=[],fcum=[];
function snapTo(ll){
  const k=Math.cos(ll[0]*Math.PI/180),R=111320;let best=1e12,al=0;
  for(let i=1;i<fpts.length;i++){
    const a=fpts[i-1],b=fpts[i],ax=(a[1]-ll[1])*k*R,ay=(a[0]-ll[0])*R,bx=(b[1]-ll[1])*k*R,by=(b[0]-ll[0])*R;
    const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy,t=l2?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/l2)):0,d=Math.hypot(ax+t*dx,ay+t*dy);
    if(d<best){best=d;al=fcum[i-1]+t*(fcum[i]-fcum[i-1])}
  }
  return{off:best,done:al};
}
function stopFollow(){if(fw!=null)navigator.geolocation.clearWatch(fw);fw=null;$('fb').textContent='Start following';$('fb').className='go';$('fo').classList.remove('off');unwake()}
$('fb').onclick=()=>{
  if(fw!=null)return stopFollow();
  fpts=path();if(fpts.length<2)return toast('Plot or load a route first');
  fcum=[0];for(let i=1;i<fpts.length;i++)fcum[i]=fcum[i-1]+LL(fpts[i-1]).distanceTo(LL(fpts[i]));
  const tot=fcum[fcum.length-1];
  fw=navigator.geolocation.watchPosition(p=>{
    const ll=showMe(p);if($('ac').checked)map.panTo(ll);
    const r=snapTo(ll),b=$('fs').querySelectorAll('b');
    b[0].textContent=mi(r.done);b[1].textContent=mi(Math.max(0,tot-r.done));b[2].textContent=Math.round(r.off*3.28084)+' ft';
    $('fo').classList.toggle('off',r.off>40);
  },gerr,{enableHighAccuracy:true,maximumAge:2000});
  $('fb').textContent='Stop following';$('fb').className='stop';wake();
};

/* ---------- record ---------- */
const rline=L.polyline([],{color:'#c2255c',weight:5}).addTo(map);
let rw=null,rec=[],rt0=0,rtick=null,asc=0,lastEle=null,rdist=0;
const upd=()=>{$('rd').textContent=mi(rdist);const s=rw!=null?Math.floor((Date.now()-rt0)/1000):0;$('rtm').textContent=Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('ra').textContent=Math.round(asc*3.28084)+' ft'};
function stopRec(){
  navigator.geolocation.clearWatch(rw);rw=null;clearInterval(rtick);
  $('rb').textContent='Start recording';$('rb').className='go';unwake();
  if(rec.length>=2){
    const n=prompt('Name this recording','Ride '+new Date().toLocaleString('en-GB'))||('Recording '+new Date().toLocaleString('en-GB'));
    save(n,rec,'track');toast('Recording saved. Find it under Saved.');
  }else toast('Recording was too short to save');
  try{localStorage.removeItem('draft')}catch(e){}
}
$('rb').onclick=()=>{
  if(rw!=null)return stopRec();
  rec=[];asc=0;lastEle=null;rdist=0;rt0=Date.now();rline.setLatLngs([]);
  rw=navigator.geolocation.watchPosition(p=>{
    const ll=showMe(p),c=p.coords;if(c.accuracy>40)return;
    const last=rec[rec.length-1];
    if(last){const d=LL(last).distanceTo(LL(ll));if(d<4)return;rdist+=d}
    if(c.altitude!=null){if(lastEle==null)lastEle=c.altitude;else if(c.altitude-lastEle>=3){asc+=c.altitude-lastEle;lastEle=c.altitude}else if(lastEle-c.altitude>=3)lastEle=c.altitude}
    rec.push([ll[0],ll[1],c.altitude,p.timestamp]);rline.addLatLng(ll);
    if($('ac').checked)map.panTo(ll);
    try{localStorage.setItem('draft',JSON.stringify(rec))}catch(e){}
    upd();
  },gerr,{enableHighAccuracy:true,maximumAge:0});
  rtick=setInterval(upd,1000);$('rb').textContent='Stop and save';$('rb').className='stop';wake();upd();
};
/* recover a recording if the page was closed mid-way */
try{const d=JSON.parse(localStorage.getItem('draft')||'null');if(d&&d.length>1){save('Recovered recording '+new Date(d[0][3]).toLocaleString('en-GB'),d,'track');toast('Recovered an unfinished recording. See Saved.')}localStorage.removeItem('draft')}catch(e){}

/* ---------- offline map area ---------- */
function tilesFor(b,z){
  const n=2**z,X=l=>Math.floor((l+180)/360*n),Y=a=>{const r=a*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n)};
  const o=[];for(let i=X(b.getWest());i<=X(b.getEast());i++)for(let j=Y(b.getNorth());j<=Y(b.getSouth());j++)o.push([z,i,j]);return o;
}
$('dl').onclick=async()=>{
  const b=map.getBounds(),z0=map.getZoom(),zmax=base.options.maxZoom;let all=[];
  for(let z=z0;z<=Math.min(z0+2,zmax);z++){const t=tilesFor(b,z);if(all.length+t.length>300){if(z===z0)return toast('Zoom in further. That area is too large to save.');break}all=all.concat(t)}
  const id=base.options.id,q=all.slice();let n=0;$('dl').disabled=true;
  const w=async()=>{while(q.length){const[z,x,y]=q.pop();try{if(!await tget(id+z+'/'+x+'/'+y)){const r=await fetch(turl(id,z,x,y));if(r.ok)await tput(id+z+'/'+x+'/'+y,await r.blob())}}catch(e){}$('dls').textContent='Saving '+(++n)+' of '+all.length}};
  await Promise.all([w(),w(),w(),w()]);
  $('dl').disabled=false;$('dls').textContent='Saved '+all.length+' tiles ('+(id==='osm'?'Streets':'Terrain')+') for offline use';
};

/* ---------- search ---------- */
let pin=null;const res=$('res');
const closeRes=()=>{res.hidden=true};
function pick(lat,lon,name,box){
  closeRes();
  if(box)map.fitBounds([[box[0],box[2]],[box[1],box[3]]],{maxZoom:17});else map.setView([lat,lon],17);
  if(pin)map.removeLayer(pin);
  const c=document.createElement('div'),t=document.createElement('b'),b=document.createElement('button');
  t.textContent=name;b.textContent='Add as route point';b.style.cssText='display:block;margin-top:6px';
  b.onclick=()=>{tabTo('plot');addWp(L.latLng(lat,lon));map.closePopup()};
  c.append(t,b);
  pin=L.circleMarker([lat,lon],{radius:10,color:'#fff',weight:3,fillColor:'#c2255c',fillOpacity:1}).addTo(map).bindPopup(c).openPopup();
}
function showRes(items,note,title){
  res.innerHTML='';
  if(title&&items.length){const t=document.createElement('div');t.style.cssText='padding:8px 12px;font-size:13px;font-weight:600;background:#f6f4ee';t.textContent=title;res.append(t)}
  if(!items.length&&!note){toast('Nothing found');return closeRes()}
  items.forEach(i=>{const b=document.createElement('button');b.innerHTML='<span></span><small></small>';b.firstChild.textContent=i.name;b.lastChild.textContent=i.sub;b.onclick=()=>pick(i.lat,i.lon,i.name,i.box);res.append(b)});
  if(note){const n=document.createElement('div');n.style.cssText='padding:8px 12px;font-size:12px;color:#6b7068';n.textContent=note;res.append(n)}
  res.hidden=false;res.scrollTop=0;
}
async function centre(){
  if(map.getZoom()>=9)return map.getCenter();
  toast('Finding your location…');
  return new Promise(res=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{map.setView(showMe(p),14);res(map.getCenter())},()=>{toast('Allow location, or zoom in to your area first');res(null)},{timeout:8000,maximumAge:60000}):res(null));
}
const OPS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
let dbg=[];
async function overpass(q){
  const one=async u=>{
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000),nm=new URL(u).host.replace('overpass','op').replace('.systems','');
    try{
      const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q),signal:ctl.signal});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();
      if(j.remark&&!(j.elements&&j.elements.length)&&/error|timed out|memory/i.test(j.remark))throw new Error('busy');
      dbg.push(nm+': '+(j.elements||[]).length);return j.elements||[];
    }catch(e){dbg.push(nm+': '+(e.name==='AbortError'?'timeout':(e.message||e)));throw e}
    finally{clearTimeout(t)}
  };
  return new Promise((resolve,reject)=>{
    let left=OPS.length,ok=false,done=false;
    const fin=()=>{if(done)return;if(--left===0){done=true;ok?resolve([]):reject(new Error('all servers failed'))}};
    OPS.forEach(u=>one(u).then(es=>{ok=true;if(es.length&&!done){done=true;resolve(es)}else fin()},()=>fin()));
  });
}
function pubItem(e,c){
  const la=e.lat!=null?e.lat:e.center.lat,lo=e.lon!=null?e.lon:e.center.lon,t=e.tags||{},d=c.distanceTo([la,lo]);
  const a=[t['addr:street'],t['addr:city']||t['addr:village']||t['addr:postcode']].filter(Boolean).join(', ');
  return{name:t.name,sub:(a||'Pub')+' · '+(d/1609.344).toFixed(1)+' mi away',lat:la,lon:lo,box:null,d};
}
const byDist=(a,b)=>a.d-b.d;
const place=x=>{
  const a=x.address||{},parts=x.display_name.split(', '),town=a.village||a.town||a.hamlet||a.suburb||a.city||'';
  return{name:x.name||parts[0],sub:[town,a.county||a.state_district||a.state||''].filter(Boolean).join(', ')||parts.slice(1,3).join(', '),lat:+x.lat,lon:+x.lon,box:['amenity','tourism','shop','leisure'].includes(x.class)?null:x.boundingbox.map(Number)};
};
const nom=async q=>(await(await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=gb&limit='+q.limit+(q.extra||'')+'&q='+encodeURIComponent(q.text))).json());
let areaDirty=false,areaT,autoKey='';
$('area').oninput=()=>{areaDirty=$('area').value.trim()!==''};
function autoArea(){
  clearTimeout(areaT);
  areaT=setTimeout(async()=>{
    if(areaDirty||map.getZoom()<10)return;
    const c=map.getCenter(),key=c.lat.toFixed(2)+','+c.lng.toFixed(2);if(key===autoKey)return;autoKey=key;
    try{
      const j=await(await fetch('https://nominatim.openstreetmap.org/reverse?format=json&zoom=14&addressdetails=1&lat='+c.lat+'&lon='+c.lng)).json(),a=j.address||{};
      const n=a.hamlet||a.village||a.suburb||a.town||a.city||a.county||'';
      if(n&&!areaDirty)$('area').value=[n,a.county&&a.county!==n?a.county:''].filter(Boolean).join(', ');
    }catch(e){}
  },900);
}
map.on('moveend',autoArea);
async function findPubs(){
  const name=$('q').value.trim(),at=$('area').value.trim();
  let c;
  if(areaDirty&&at){
    toast('Finding '+at+'…');
    let r;try{r=(await nom({text:at,limit:1}))[0]}catch(e){return toast('Search needs an internet connection')}
    if(!r)return toast('Could not find that area');
    c=L.latLng(+r.lat,+r.lon);map.setView(c,14);
  }else c=await centre();
  if(!c)return;
  showRes([],'Searching for pubs…');
  dbg=[];let items=[],failed=false,title='';
  const rx=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  const filt=name?'["name"~"'+rx+'",i]':'["name"]';
  const ask=async m=>(await overpass('[out:json][timeout:12];nwr["amenity"="pub"]'+filt+'(around:'+m+','+c.lat+','+c.lng+');out center;')).map(e=>pubItem(e,c)).sort(byDist).slice(0,25);
  try{
    items=await ask(name?15000:4000);title=name?'Matches within 9 miles, nearest first':'Pubs within 2.5 miles, nearest first';
    if(!items.length&&!name){items=await ask(10000);title='Pubs within 6 miles, nearest first'}
  }catch(e){failed=true}
  if(!items.length){
    try{
      if(name){
        items=(await nom({text:name+(at?' '+at:''),limit:6})).map(place);title='Closest matches found';
      }else{
        const seen=new Set();let all=[];
        for(const [dx,dy] of [[.05,.035],[.12,.09]]){
          const r=await nom({text:'pub',limit:40,extra:'&bounded=1&viewbox='+[c.lng-dx,c.lat+dy,c.lng+dx,c.lat-dy].join(',')});
          r.forEach(x=>{const k=x.place_id||x.osm_id;if(!seen.has(k)){seen.add(k);all.push(x)}});
          if(all.length>=8)break;
        }
        items=all.map(x=>{const i=place(x);i.d=c.distanceTo([i.lat,i.lon]);i.sub=(i.sub?i.sub+' · ':'')+(i.d/1609.344).toFixed(1)+' mi away';return i}).sort(byDist).slice(0,25);
        title='Pubs found nearby, nearest first';
      }
      failed=false;dbg.push('search: '+items.length);
    }catch(e){dbg.push('search: '+(e&&e.message||e))}
  }
  const note='v9 · '+items.length+' found near '+c.lat.toFixed(3)+', '+c.lng.toFixed(3)+' · '+dbg.join(' · ');
  showRes(items,(failed&&!items.length?'The pub service is busy. Try again in a minute. ':'')+note,title);
}
$('pubs').onclick=findPubs;
['q','area'].forEach(id=>$(id).onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();findPubs()}else if(e.key==='Escape')closeRes()});

/* startup: open a route from HDSG Walks, otherwise centre on my location */
async function openFromHdsg(kind,id){
  const t=kind==='walk'?'walk_events':'trip_day_levels';
  try{
    const r=await fetch(`${SB_URL}/rest/v1/${t}?id=eq.${encodeURIComponent(id)}&select=gpx_content,gpx_filename`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    const j=await r.json();
    if(!j[0]||!j[0].gpx_content)throw 0;
    return{gpx:j[0].gpx_content,name:(j[0].gpx_filename||'route').replace(/\.gpx$/i,'')};
  }catch(e){return null}
}
(async()=>{
  let o=null;const m=location.hash.match(/^#(walk|level)=([\w-]+)/);
  if(m)o=await openFromHdsg(m[1],m[2]);
  if(!o){try{const s=JSON.parse(localStorage.getItem('cos_open')||'null');if(s&&s.gpx&&Date.now()-s.t<60000)o={gpx:s.gpx,name:s.name}}catch(e){}}
  try{localStorage.removeItem('cos_open')}catch(e){}
  if(o){
    const r=parseGpx(o.gpx);
    if(r.pts.length>1){loaded=r.pts;redraw();map.invalidateSize();map.fitBounds(line.getBounds(),{padding:[40,40]});tabTo('follow');$('back').hidden=false;toast('Loaded '+(o.name||'route'));return}
  }
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>map.setView(showMe(p),14),()=>{},{enableHighAccuracy:false,timeout:10000,maximumAge:60000});
})();
list();
